<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Square Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div class="ui-layer">
            <div class="esc-btn"></div>
            <span>Esc</span>
        </div>

        <div class="container">
            <div id="level-layout">
                <div id="player">
                    <div class="face"></div>
                </div>

                <div class="door"></div>

                <div class="spike-group  dynamic-spike" style="left: 40%;">
                    <div class="spike"></div>
                    <div class="spike"></div>
                    <div class="spike"></div>
                    <div class="spike"></div>
                </div>
                <div class="spike-group" style="left: 70%;">
                    <div class="spike"></div>
                    <div class="spike"></div>
                    <div class="spike"></div>
                    <div class="spike"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
